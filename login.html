<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 400px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-size: 15px;
        }

        .login-btn {
            background: #007bff;
        }

        .reset-btn {
            background: #35dcd9;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Login Form</h2>

        <form action="{{ url_for('login') }}" method="POST">

            <label for="username">Username:</label>
            <input
                type="text"
                id="username"
                name="username"
                required>

            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                required>

            <div class="buttons">
                <button type="submit" class="login-btn">
                    Login
                </button>

                <button type="reset" class="reset-btn">
                    Reset
                </button>
            </div>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="{{ url_for('register') }}">Register</a>
        </div>

    </div>

</body>
</html>
