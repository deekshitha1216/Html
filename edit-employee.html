<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Employee</title>

    <!-- Modern Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">


    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================= */

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;

            transition:
                background-color 0.3s,
                color 0.3s;
        }


        /* =========================
           LIGHT THEME
        ========================= */

        body.light {
            background: #f5f3fa;
            color: #222;
        }

        body.light .container {
            background: #ffffff;
            color: #222;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.08);
        }

        body.light h1 {
            color: #18151f;
        }

        body.light label {
            color: #333;
        }

        body.light input,
        body.light textarea {
            background: #faf9fc;
            color: #222;
            border: 1px solid #ddd6e8;
        }


        /* =========================
           DARK THEME
        ========================= */

        body.dark {
            background: #0b0a0f;
            color: #ffffff;
        }

        body.dark .container {
            background: #15131b;
            color: white;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.45);
        }

        body.dark h1 {
            color: white;
        }

        body.dark label {
            color: #e5e5e5;
        }

        body.dark input,
        body.dark textarea {
            background: #211e29;
            color: white;
            border: 1px solid #393342;
        }

        body.dark input::placeholder,
        body.dark textarea::placeholder {
            color: #999;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            background: #0d0c10;

            padding: 17px 35px;

            display: flex;
            align-items: center;

            flex-wrap: wrap;
            gap: 20px;

            border-bottom: 1px solid #29232f;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {
            color: white;

            font-size: 22px;
            font-weight: 700;

            margin-right: auto;

            letter-spacing: 0.3px;
        }

        .logo span {
            color: #a855f7;
        }


        /* =========================
           THEME BUTTONS
        ========================= */

        .theme-buttons {
            display: flex;
            align-items: center;

            gap: 8px;
            margin-right: 5px;
        }

        .theme-buttons a {
            color: #ffffff;

            text-decoration: none;

            border: 1px solid #7c3aed;

            padding: 7px 12px;

            border-radius: 8px;

            font-size: 13px;
            font-weight: 500;

            transition: 0.3s;
        }

        .theme-buttons a:hover {
            background: #7c3aed;

            box-shadow:
                0 5px 15px rgba(124, 58, 237, 0.35);
        }


        /* =========================
           NAV LINKS
        ========================= */

        .nav-links {
            display: flex;
            align-items: center;

            list-style: none;

            gap: 22px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #eeeeee;

            text-decoration: none;

            font-size: 14px;
            font-weight: 500;

            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #c084fc;
        }


        /* =========================
           FORM CONTAINER
        ========================= */

        .container {
            width: 620px;
            max-width: 92%;

            margin: 50px auto;

            padding: 35px;

            border-radius: 18px;

            transition:
                background-color 0.3s,
                color 0.3s;
        }


        /* =========================
           HEADING
        ========================= */

        h1 {
            text-align: center;

            margin-bottom: 30px;

            font-size: 28px;
            font-weight: 700;

            letter-spacing: 0.3px;
        }


        /* Purple line under heading */

        h1::after {
            content: "";

            display: block;

            width: 55px;
            height: 4px;

            margin: 10px auto 0;

            background: #a855f7;

            border-radius: 10px;
        }


        /* =========================
           LABEL
        ========================= */

        label {
            display: block;

            margin-top: 18px;
            margin-bottom: 7px;

            font-size: 14px;
            font-weight: 600;
        }


        /* =========================
           INPUTS
        ========================= */

        input,
        textarea {
            width: 100%;

            padding: 12px 14px;

            border-radius: 9px;

            font-family: 'Poppins', sans-serif;
            font-size: 14px;

            outline: none;

            transition:
                background-color 0.3s,
                color 0.3s,
                border-color 0.3s,
                box-shadow 0.3s;
        }


        /* Input focus */

        input:focus,
        textarea:focus {
            border-color: #a855f7;

            box-shadow:
                0 0 0 3px rgba(168, 85, 247, 0.15);
        }


        /* =========================
           TEXTAREA
        ========================= */

        textarea {
            height: 110px;

            resize: vertical;
        }


        /* =========================
           UPDATE BUTTON
        ========================= */

        .update-btn {
            width: 100%;

            margin-top: 30px;

            padding: 13px;

            border: none;

            background: #7c3aed;

            color: white;

            font-family: 'Poppins', sans-serif;

            font-size: 15px;
            font-weight: 600;

            border-radius: 9px;

            cursor: pointer;

            transition: 0.3s;
        }

        .update-btn:hover {
            background: #9333ea;

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(124, 58, 237, 0.35);
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-btn {
            display: block;

            text-align: center;

            margin-top: 18px;

            text-decoration: none;

            color: #777;

            font-size: 14px;
            font-weight: 500;

            transition: 0.3s;
        }

        .back-btn:hover {
            color: #a855f7;
        }


        /* Dark Mode Back Button */

        body.dark .back-btn {
            color: #aaa;
        }

        body.dark .back-btn:hover {
            color: #c084fc;
        }


        /* =========================
           MOBILE RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .navbar {
                flex-direction: column;

                justify-content: center;

                text-align: center;
            }

            .logo {
                margin-right: 0;
            }

            .theme-buttons {
                margin-right: 0;
            }

            .nav-links {
                justify-content: center;
            }

        }


        @media (max-width: 600px) {

            .container {
                width: 95%;
                max-width: 95%;

                margin: 30px auto;

                padding: 23px;
            }

            .nav-links {
                gap: 12px;
            }

            .nav-links a {
                font-size: 13px;
            }

            .theme-buttons a {
                font-size: 12px;

                padding: 6px 9px;
            }

            .logo {
                font-size: 18px;
            }

            h1 {
                font-size: 23px;
            }

        }

    </style>

</head>


<body class="{{ theme }}">


    <!-- =========================
         NAVBAR
    ========================= -->

    <nav class="navbar">


        <!-- LOGO -->

        <div class="logo">
            Employee <span>Management</span> System
        </div>


        <!-- THEME BUTTONS -->

        <div class="theme-buttons">

            <a href="/set-theme/light">
                Light
            </a>

            <a href="/set-theme/dark">
                Dark
            </a>

        </div>


        <!-- NAVIGATION -->

        <ul class="nav-links">

            <li>
                <a href="/">
                    Home
                </a>
            </li>


            <li>
                <a href="/employees">
                    Employees
                </a>
            </li>


            <li>
                <a href="/add-employee">
                    Add Employee
                </a>
            </li>


            <li>
                <a href="/search">
                    Search
                </a>
            </li>


            {% if username %}

                <li>
                    <a href="/logout">
                        Logout
                    </a>
                </li>

            {% else %}

                <li>
                    <a href="/login">
                        Login
                    </a>
                </li>

                <li>
                    <a href="/register">
                        Register
                    </a>
                </li>

            {% endif %}

        </ul>

    </nav>


    <!-- =========================
         EDIT FORM
    ========================= -->

    <div class="container">

        <h1>
            Edit Employee
        </h1>


        <form
            action="/edit-employee/{{ employee['id'] }}"
            method="POST">


            <!-- Employee Name -->

            <label for="name">
                Employee Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ employee['name'] }}"
                required>


            <!-- Email -->

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                value="{{ employee['email'] }}"
                required>


            <!-- Phone -->

            <label for="phone">
                Phone
            </label>

            <input
                type="text"
                id="phone"
                name="phone"
                value="{{ employee['phone'] }}"
                required>


            <!-- Department -->

            <label for="department">
                Department
            </label>

            <input
                type="text"
                id="department"
                name="department"
                value="{{ employee['department'] }}"
                required>


            <!-- Salary -->

            <label for="salary">
                Salary
            </label>

            <input
                type="number"
                id="salary"
                name="salary"
                value="{{ employee['salary'] }}"
                min="0"
                required>


            <!-- Joining Date -->

            <label for="joining_date">
                Joining Date
            </label>

            <input
                type="date"
                id="joining_date"
                name="joining_date"
                value="{{ employee['joining_date'] }}"
                required>


            <!-- Address -->

            <label for="address">
                Address
            </label>

            <textarea
                id="address"
                name="address"
                required>{{ employee['address'] or '' }}</textarea>


            <!-- Update Button -->

            <button
                type="submit"
                class="update-btn">

                Update Employee

            </button>


        </form>


        <!-- Back Button -->

        <a href="/employees"
           class="back-btn">

            ← Back to Employees

        </a>


    </div>


</body>

</html>
