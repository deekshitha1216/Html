
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================= */

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f3f8;
            color: #222;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            background: #17151f;

            padding: 18px 40px;

            display: flex;
            align-items: center;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }


        /* =========================
           LOGO
        ========================= */

        .logo {
            color: #ffffff;

            font-size: 23px;

            font-weight: bold;

            letter-spacing: 0.5px;

            margin-right: auto;
        }


        .logo span {
            color: #a855f7;
        }


        /* =========================
           NAVIGATION
        ========================= */

        .nav-links {
            display: flex;

            align-items: center;

            list-style: none;

            gap: 5px;
        }


        .nav-links a {
            color: #dddddd;

            text-decoration: none;

            font-size: 15px;

            padding: 10px 15px;

            border-radius: 7px;

            transition: all 0.3s ease;
        }


        /* Hover */

        .nav-links a:hover {
            background: #2a2635;

            color: #c084fc;
        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-btn {
            border: 1px solid #a855f7;

            color: #c084fc !important;

            padding: 9px 18px !important;
        }


        .login-btn:hover {
            background: #a855f7 !important;

            color: white !important;
        }


        /* =========================
           REGISTER BUTTON
        ========================= */

        .register-btn {
            background: #a855f7;

            color: white !important;

            padding: 9px 18px !important;

            font-weight: bold;
        }


        .register-btn:hover {
            background: #9333ea !important;

            color: white !important;
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .content {
            min-height: calc(100vh - 70px);

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 40px;
        }


        /* =========================
           CONTENT CARD
        ========================= */

        .welcome-card {
            background: white;

            padding: 55px 70px;

            border-radius: 18px;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);

            max-width: 800px;

            width: 100%;
        }


        /* =========================
           HEADING
        ========================= */

        .content h1 {
            color: #17151f;

            font-size: 38px;

            margin-bottom: 18px;
        }


        /* Purple text */

        .highlight {
            color: #a855f7;
        }


        /* =========================
           PARAGRAPH
        ========================= */

        .content p {
            color: #777;

            font-size: 18px;

            line-height: 1.6;

            margin-bottom: 30px;
        }


        /* =========================
           GET STARTED BUTTON
        ========================= */

        .start-btn {
            display: inline-block;

            background: #a855f7;

            color: white;

            text-decoration: none;

            padding: 12px 25px;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            transition: 0.3s;
        }


        .start-btn:hover {
            background: #9333ea;

            transform: translateY(-2px);
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .navbar {
                flex-direction: column;

                gap: 15px;

                padding: 18px 20px;
            }


            .logo {
                margin-right: 0;
            }


            .nav-links {
                flex-wrap: wrap;

                justify-content: center;
            }


            .welcome-card {
                padding: 40px 25px;
            }


            .content h1 {
                font-size: 30px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <nav class="navbar">


        <!-- Logo -->

        <div class="logo">
            Employee <span>Management</span> System
        </div>


        <!-- Navigation -->

        <ul class="nav-links">

            <li>
                <a href="/">Home</a>
            </li>

            <li>
                <a href="/employee">Employees</a>
            </li>

            <li>
                <a href="/add-employee">Add Employee</a>
            </li>

            <li>
                <a href="/search">Search</a>
            </li>

            <li>
                <a href="/login" class="login-btn">
                    Login
                </a>
            </li>

            <li>
                <a href="/register" class="register-btn">
                    Register
                </a>
            </li>

        </ul>

    </nav>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <div class="content">

        <div class="welcome-card">

            <h1>
                Welcome to
                <span class="highlight">
                    Employee Management System
                </span>
            </h1>

            <p>
                Manage employee information, add new employees,
                search records and maintain your organization
                efficiently in one place.
            </p>

            <a href="/employee" class="start-btn">
                View Employees
            </a>

        </div>

    </div>


</body>

</html>
